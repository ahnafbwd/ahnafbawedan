<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Admin - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: "#4F46E5",
                        secondary: "#10B981",
                        dark: "#1F2937",
                        light: "#F9FAFB",
                    },
                },
            },
        };
    </script>
    <style>
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .shake {
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md fade-in">
        <div class="text-center mb-8">
            <div class="bg-primary rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M18 8a6 6 0 01-7.743 5.743L10 14l-1 1-1 1H6v2H2v-4l4.257-4.257A6 6 0 1118 8zm-6-4a1 1 0 100 2 2 2 0 012 2 1 1 0 102 0 4 4 0 00-4-4z" clip-rule="evenodd" />
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-dark mb-2">Portfolio Admin</h1>
            <p class="text-gray-600">Enter your credentials to access the admin panel</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div class="space-y-1">
                <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    required 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent"
                    placeholder="Enter your username"
                />
            </div>

            <div class="space-y-1">
                <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent pr-10"
                        placeholder="Enter your password"
                    />
                    <button 
                        type="button" 
                        id="togglePassword" 
                        class="absolute inset-y-0 right-0 flex items-center pr-3 text-gray-400 hover:text-gray-600"
                    >
                        <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                            <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between">
                <label class="flex items-center">
                    <input type="checkbox" id="rememberMe" class="h-4 w-4 text-primary focus:ring-primary border-gray-300 rounded">
                    <span class="ml-2 text-sm text-gray-600">Remember me</span>
                </label>
                <button type="button" id="forgotPassword" class="text-sm text-primary hover:text-indigo-700">
                    Forgot password?
                </button>
            </div>

            <button 
                type="submit" 
                id="loginBtn"
                class="w-full bg-primary hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-md transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2"
            >
                <span id="loginText">Sign In</span>
                <div id="loginSpinner" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-white mx-auto"></div>
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-sm text-gray-600">
                Don't have access? 
                <a href="#" class="text-primary hover:text-indigo-700" id="contactAdmin">Contact admin</a>
            </p>
        </div>

        <!-- Error message -->
        <div id="errorMessage" class="hidden mt-4 p-3 bg-red-100 border border-red-400 text-red-700 rounded-md text-sm">
            <div class="flex items-center">
                <svg class="w-4 h-4 mr-2" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
                </svg>
                <span id="errorText">Invalid credentials. Please try again.</span>
            </div>
        </div>

        <!-- First time setup -->
        <div id="setupModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div class="bg-white rounded-xl p-6 w-full max-w-md mx-4">
                <h2 class="text-xl font-bold text-dark mb-4">First Time Setup</h2>
                <p class="text-gray-600 mb-4">Set up your admin credentials for the first time.</p>
                
                <form id="setupForm" class="space-y-4">
                    <div>
                        <label for="setupUsername" class="block text-sm font-medium text-gray-700">Username</label>
                        <input 
                            type="text" 
                            id="setupUsername" 
                            required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
                            placeholder="Choose a username"
                        />
                    </div>
                    
                    <div>
                        <label for="setupPassword" class="block text-sm font-medium text-gray-700">Password</label>
                        <input 
                            type="password" 
                            id="setupPassword" 
                            required 
                            minlength="6"
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
                            placeholder="Choose a secure password (min 6 chars)"
                        />
                    </div>
                    
                    <div>
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700">Confirm Password</label>
                        <input 
                            type="password" 
                            id="confirmPassword" 
                            required 
                            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"
                            placeholder="Confirm your password"
                        />
                    </div>
                    
                    <button 
                        type="submit" 
                        class="w-full bg-primary hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-md transition-colors"
                    >
                        Create Admin Account
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // Simple authentication system for GitHub Pages
        class SimpleAuth {
            constructor() {
                this.AUTH_KEY = 'portfolio_auth';
                this.SESSION_KEY = 'portfolio_session';
                this.SETUP_KEY = 'portfolio_setup';
                this.init();
            }

            init() {
                this.checkFirstTimeSetup();
                this.setupEventListeners();
                this.checkExistingSession();
            }

            // Simple hash function (not cryptographically secure, but okay for basic protection)
            simpleHash(str) {
                let hash = 0;
                for (let i = 0; i < str.length; i++) {
                    const char = str.charCodeAt(i);
                    hash = ((hash << 5) - hash) + char;
                    hash = hash & hash; // Convert to 32-bit integer
                }
                return hash.toString();
            }

            checkFirstTimeSetup() {
                const isSetup = localStorage.getItem(this.SETUP_KEY);
                if (!isSetup) {
                    document.getElementById('setupModal').classList.remove('hidden');
                }
            }

            setupEventListeners() {
                // Login form
                document.getElementById('loginForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleLogin();
                });

                // Setup form
                document.getElementById('setupForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleSetup();
                });

                // Toggle password visibility
                document.getElementById('togglePassword').addEventListener('click', () => {
                    this.togglePasswordVisibility();
                });

                // Forgot password
                document.getElementById('forgotPassword').addEventListener('click', () => {
                    this.handleForgotPassword();
                });

                // Contact admin
                document.getElementById('contactAdmin').addEventListener('click', () => {
                    this.handleContactAdmin();
                });
            }

            handleSetup() {
                const username = document.getElementById('setupUsername').value.trim();
                const password = document.getElementById('setupPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                if (password !== confirmPassword) {
                    this.showError('Passwords do not match!');
                    return;
                }

                if (password.length < 6) {
                    this.showError('Password must be at least 6 characters long!');
                    return;
                }

                // Store credentials
                const credentials = {
                    username: username,
                    password: this.simpleHash(password),
                    createdAt: new Date().toISOString()
                };

                localStorage.setItem(this.AUTH_KEY, JSON.stringify(credentials));
                localStorage.setItem(this.SETUP_KEY, 'true');

                // Hide setup modal
                document.getElementById('setupModal').classList.add('hidden');
                this.showNotification('Admin account created successfully! You can now login.');
            }

            handleLogin() {
                const username = document.getElementById('username').value.trim();
                const password = document.getElementById('password').value;
                const rememberMe = document.getElementById('rememberMe').checked;

                this.showLoading(true);

                // Simulate loading time
                setTimeout(() => {
                    const storedCredentials = localStorage.getItem(this.AUTH_KEY);
                    
                    if (!storedCredentials) {
                        this.showError('No admin account found. Please contact administrator.');
                        this.showLoading(false);
                        return;
                    }

                    const credentials = JSON.parse(storedCredentials);
                    const hashedPassword = this.simpleHash(password);

                    if (username === credentials.username && hashedPassword === credentials.password) {
                        // Create session
                        const session = {
                            username: username,
                            loginTime: new Date().toISOString(),
                            rememberMe: rememberMe,
                            expires: rememberMe ? 
                                new Date(Date.now() + 30 * 24 * 60 * 60 * 1000).toISOString() : // 30 days
                                new Date(Date.now() + 24 * 60 * 60 * 1000).toISOString() // 24 hours
                        };

                        localStorage.setItem(this.SESSION_KEY, JSON.stringify(session));
                        
                        this.showNotification('Login successful! Redirecting...');
                        
                        // Redirect to admin panel
                        setTimeout(() => {
                            window.location.href = 'project.html';
                        }, 1500);
                    } else {
                        this.showError('Invalid username or password!');
                        this.shakeForm();
                    }
                    
                    this.showLoading(false);
                }, 1000);
            }

            checkExistingSession() {
                const session = localStorage.getItem(this.SESSION_KEY);
                if (session) {
                    const sessionData = JSON.parse(session);
                    const now = new Date();
                    const expires = new Date(sessionData.expires);

                    if (now < expires) {
                        // Valid session exists, redirect to admin
                        this.showNotification('Active session found. Redirecting...');
                        setTimeout(() => {
                            window.location.href = 'project.html';
                        }, 1000);
                    } else {
                        // Session expired
                        localStorage.removeItem(this.SESSION_KEY);
                    }
                }
            }

            handleForgotPassword() {
                if (confirm('This will reset your admin credentials. You will need to set up a new account. Continue?')) {
                    localStorage.removeItem(this.AUTH_KEY);
                    localStorage.removeItem(this.SETUP_KEY);
                    localStorage.removeItem(this.SESSION_KEY);
                    this.showNotification('Admin credentials reset. Please set up a new account.');
                    setTimeout(() => {
                        location.reload();
                    }, 2000);
                }
            }

            handleContactAdmin() {
                const message = 'Please contact the website administrator for access to the portfolio admin panel.';
                if (navigator.share) {
                    navigator.share({
                        title: 'Portfolio Admin Access Request',
                        text: message
                    });
                } else {
                    // Fallback: copy to clipboard
                    navigator.clipboard.writeText(message).then(() => {
                        this.showNotification('Contact message copied to clipboard!');
                    });
                }
            }

            togglePasswordVisibility() {
                const passwordInput = document.getElementById('password');
                const eyeIcon = document.getElementById('eyeIcon');
                
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    eyeIcon.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 01.66 10a10.07 10.07 0 0117.28 0 9.94 9.94 0 01-1.74 2.05M1 1l18 18M9.9 4.24A5.12 5.12 0 0110 4a5 5 0 015 5 4.38 4.38 0 01-.24.9M15 9a5 5 0 01-5 5 3.1 3.1 0 01-.9-.1"/>
                    `;
                } else {
                    passwordInput.type = 'password';
                    eyeIcon.innerHTML = `
                        <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                        <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                    `;
                }
            }

            showLoading(show) {
                const loginText = document.getElementById('loginText');
                const loginSpinner = document.getElementById('loginSpinner');
                const loginBtn = document.getElementById('loginBtn');

                if (show) {
                    loginText.classList.add('hidden');
                    loginSpinner.classList.remove('hidden');
                    loginBtn.disabled = true;
                } else {
                    loginText.classList.remove('hidden');
                    loginSpinner.classList.add('hidden');
                    loginBtn.disabled = false;
                }
            }

            showError(message) {
                const errorDiv = document.getElementById('errorMessage');
                const errorText = document.getElementById('errorText');
                
                errorText.textContent = message;
                errorDiv.classList.remove('hidden');
                
                setTimeout(() => {
                    errorDiv.classList.add('hidden');
                }, 5000);
            }

            shakeForm() {
                const form = document.getElementById('loginForm');
                form.classList.add('shake');
                setTimeout(() => {
                    form.classList.remove('shake');
                }, 500);
            }

            showNotification(message) {
                // Create notification
                const notification = document.createElement('div');
                notification.className = 'fixed top-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg z-50 fade-in';
                notification.innerHTML = `
                    <div class="flex items-center gap-2">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
                        </svg>
                        <span>${message}</span>
                    </div>
                `;
                
                document.body.appendChild(notification);
                
                setTimeout(() => {
                    notification.remove();
                }, 5000);
            }

            // Static method to check if user is authenticated (for use in other pages)
            static isAuthenticated() {
                const session = localStorage.getItem('portfolio_session');
                if (!session) return false;

                const sessionData = JSON.parse(session);
                const now = new Date();
                const expires = new Date(sessionData.expires);

                return now < expires;
            }

            // Static method to logout
            static logout() {
                localStorage.removeItem('portfolio_session');
                window.location.href = 'auth.html';
            }

            // Static method to get current user
            static getCurrentUser() {
                const session = localStorage.getItem('portfolio_session');
                if (!session) return null;

                const sessionData = JSON.parse(session);
                return sessionData.username;
            }
        }

        // Initialize authentication system
        document.addEventListener('DOMContentLoaded', () => {
            new SimpleAuth();
        });

        // Export for use in other files
        window.SimpleAuth = SimpleAuth;
    </script>
</body>
</html>
